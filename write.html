<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dịch Hán Việt</title>

<style>
:root{
    --bg-image: url("bg-china2.png");
}

body{
    margin:0;
    font-family:Arial, sans-serif;

    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
    overflow:hidden;
}

/* NỀN CHUNG TOÀN WEB */
body::before{
    content:"";
    position:fixed;
    inset:0;

    background-image: var(--bg-image);
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    z-index:-2;
}

/* CARD */
.container{
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    padding:30px;
    border-radius:25px;
    width:600px;
    max-width:90%;

    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
}

/* input */
textarea{
    width:90%;
    height:160px;
    padding:12px;
    font-size:20px;
    border-radius:10px;
    border:1px solid #ccc;
}

/* kết quả */
.result{
    margin-top:20px;
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    font-size:24px;
    color:#333;
    min-height:60px;
    text-align:left;
    line-height:1.8;
}

/* popup */
.popup{
    position:absolute;
    background:white;
    border:1px solid #ccc;
    border-radius:10px;
    padding:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
    display:none;
    z-index:999;
}

.popup div{
    padding:5px;
    cursor:pointer;
}

.popup div:hover{
    background:#eee;
}

/* home button */
a{
    display:inline-block;
    margin-top:20px;
    padding:12px 20px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
    transition:0.3s;
}

a:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<div class="container">

    <h1>✍️ Dịch Hán Việt</h1>

    <textarea id="inputText"
        placeholder="Nhập đoạn văn..."
        oninput="translateText()"></textarea>

    <div class="result" id="result">kết quả</div>

    <a href="index.html">🏠 Quay lại trang chủ</a>

</div>

<!-- popup -->
<div id="popup" class="popup"></div>

<script src="sentences2.js"></script>

<script>

function showPopup(x, y, meanings, callback){

    const popup = document.getElementById("popup");
    popup.innerHTML = "";

    meanings.forEach(m=>{
        const div = document.createElement("div");
        div.innerText = m;

        div.onclick = ()=>{
            callback(m);
            popup.style.display = "none";
        };

        popup.appendChild(div);
    });

    popup.style.left = x + "px";
    popup.style.top = y + "px";
    popup.style.display = "block";
}

document.addEventListener("click", ()=>{
    document.getElementById("popup").style.display = "none";
});

/* translate */
function translateText() {

    const text = document.getElementById("inputText").value.trim();
    const resultDiv = document.getElementById("result");

    if (!text) {
        resultDiv.innerHTML = "Nghĩa sẽ hiện ở đây";
        return;
    }

    let result = [];
    let i = 0;

    while (i < text.length) {

        let found = false;

        for (let len = 10; len >= 1; len--) {

            const part = text.substring(i, i + len);

            const word = sentences2.find(w => w.hanzi === part);

            if (word) {

                const meanings = word.meaning
                .split(",")
                .map(m => m.replace(/\(.*?\)/g, "").trim())
                .filter(m => m);

                const span = document.createElement("span");
                span.innerText = meanings[0] + " ";

                span.onclick = (e)=>{
                    e.stopPropagation();

                    showPopup(e.pageX, e.pageY, meanings, (value)=>{
                        span.innerText = value + " ";
                    });
                };

                result.push(span.outerHTML);

                i += len;
                found = true;
                break;
            }
        }

        if (!found) i++;
    }

    resultDiv.innerHTML = result.join("");
}

/* 🔥 ĐỒNG BỘ NỀN TOÀN WEB */
window.addEventListener("load", () => {

    const saved = localStorage.getItem("bg-index");

    const backgrounds = [
        "bg-china.png",
        "bg-china2.png",
        "bg-china3.png",
        "bg-china4.png",
        "bg-china5.png"
    ];

    if(saved !== null){
        document.documentElement.style.setProperty(
            '--bg-image',
            `url("${backgrounds[saved]}")`
        );
    } else {
        document.documentElement.style.setProperty(
            '--bg-image',
            `url("bg-china2.png")`
        );
    }
});

</script>

</body>
</html>
