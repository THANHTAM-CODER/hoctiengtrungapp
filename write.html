<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dịch Hán Việt</title>

<style>
:root{
    --bg-image: url("bg-china2.png");
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image: var(--bg-image);
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    z-index:-2;
}

.container{
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    padding:30px;
    border-radius:25px;
    width:600px;
    max-width:90%;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
}

textarea{
    width:90%;
    height:160px;
    padding:12px;
    font-size:20px;
    border-radius:10px;
    border:1px solid #ccc;
}

.result{
    margin-top:20px;
    background:white;
    border-radius:10px;
    padding:15px;
    font-size:24px;
    min-height:60px;
    text-align:left;
    line-height:1.8;
}

.tts-btn{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:12px;
    padding:12px 18px;
    margin:10px 5px;
    font-weight:bold;
    cursor:pointer;
}

.tts-btn.speaking{
    box-shadow:0 0 15px #2563eb;
    transform:scale(1.05);
    animation:glow 1s infinite alternate;
}

@keyframes glow{
    from{box-shadow:0 0 5px #2563eb;}
    to{box-shadow:0 0 25px #2563eb;}
}

a{
    display:inline-block;
    margin-top:20px;
    padding:12px 20px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

    <h1>✍️ Dịch Hán Việt</h1>

    <textarea id="inputText" placeholder="Nhập đoạn văn..." oninput="translateText()"></textarea>

    <div style="margin-top:15px;">
        <button class="tts-btn" onclick="readChinese(event)">🔊 Đọc tiếng Trung</button>
        <button class="tts-btn" onclick="readVietnamese(event)">📖 Đọc nghĩa</button>
    </div>

    <div class="result" id="result">...</div>

    <a href="menu.html">🏠 Trang chủ</a>
</div>

<script src="sentences2.js"></script>

<script>

/* ================== XOÁ NGOẶC TOÀN BỘ DATA ================== */
function cleanMeaning(text){
    if(!text) return "";

    return text
        .split(",")
        .map(m => m.replace(/\s*\(.*?\)\s*/g, "").trim())
        .filter(Boolean)
        .join(",");
}

/* làm sạch toàn bộ dữ liệu 1 lần */
sentences2.forEach(w => {
    w.meaning = cleanMeaning(w.meaning);
});

/* ================== TRANSLATE ================== */
function translateText(){

    const text = document.getElementById("inputText").value.trim();
    const resultDiv = document.getElementById("result");

    if(!text){
        resultDiv.innerHTML = "Nghĩa sẽ hiện ở đây";
        return;
    }

    let result = [];
    let i = 0;

    while(i < text.length){

        let found = false;

        for(let len = 10; len >= 1; len--){

            const part = text.substring(i, i + len);
            const word = sentences2.find(w => w.hanzi === part);

            if(word){

                // 🔥 CHỈ SỬA 1 CHỖ Ở ĐÂY: bỏ ngoặc
                let meaning = word.meaning
                    .split(",")[0]
                    .replace(/[（(][^）)]*[）)]/g, "")
                    .replace(/\s+/g, " ")
                    .trim();

                const span = document.createElement("span");
                span.innerText = meaning + " ";

                result.push(span.outerHTML);

                i += len;
                found = true;
                break;
            }
        }

        if(!found) i++;
    }

    resultDiv.innerHTML = result.join("");
}

/* ================== TTS ================== */
function speak(text, lang, btn){
    if(!text) return;

    speechSynthesis.cancel();

    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;

    if(btn) btn.classList.add("speaking");

    u.onend = () => {
        if(btn) btn.classList.remove("speaking");
    };

    speechSynthesis.speak(u);
}

function readChinese(e){
    speak(document.getElementById("inputText").value, "zh-CN", e?.target);
}

function readVietnamese(e){
    speak(document.getElementById("result").innerText, "vi-VN", e?.target);
}

/* ================== BACKGROUND ================== */
window.addEventListener("load", () => {

    const saved = localStorage.getItem("bg-index");

    const backgrounds = [
        "bg-china.png",
        "bg-china2.png",
        "bg-china3.png",
        "bg-china4.png",
        "bg-china5.png"
    ];

    document.documentElement.style.setProperty(
        '--bg-image',
        `url("${backgrounds[saved] || "bg-china2.png"}")`
    );
});

</script>

</body>
</html>
