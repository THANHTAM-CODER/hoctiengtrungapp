<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<title>说 汉语</title>

<style>
:root{
    --bg-image: url("bg-china2.png");
}

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
    overflow:hidden;
}

/* NỀN CHUNG TOÀN WEB */
body::before{
    content:"";
    position:fixed;
    inset:0;

    background-image: var(--bg-image);
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    z-index:-2;
}

/* giữ layout của bạn */
.container{
    position:relative;
}

/* modal giữ từ style.css */
</style>
</head>

<body>

<div class="petals"></div>

<div class="assistant">
    <div class="talk" id="talk">Xin chào 😄</div>
    <div class="avatar-circle">
        <video autoplay loop muted playsinline>
            <source src="nhanvat.mp4" type="video/mp4">
        </video>
    </div>
</div>

<!-- 📘 HƯỚNG DẪN MODAL -->
<div id="guideModal" class="modal">
    <div class="modal-content">
        <h2>📘 Hướng dẫn sử dụng</h2>

        <p>📖 Nhấn Random để lấy từ mới</p>
        <p>📖 Nhập nghĩa tiếng Việt</p>
        <p>📖 Nhấn Kiểm Tra để kiểm tra đúng sai</p>
        <p>📖 Từ số ghi: số ...</p>
        <p>📖 Từ nhiều nghĩa phải nhập ít nhất 2 nghĩa</p>
        <p>📖 Ví dụ: 好 = khỏe,đẹp,ok</p>

        <button onclick="closeGuide()">⬅ Quay về</button>
    </div>
</div>

<div class="container">

    <h1>📖 学汉语</h1>
    <h2 class="slogan">汉语不太难</h2>

    <div class="card">
        <h2 id="hanzi">Nhấn Random</h2>

        <input type="text" id="answer" placeholder="Nhập nghĩa tiếng Việt">

        <br>

        <button onclick="checkAnswer()" onmouseenter="showTalkAlternating('randomCheck', ['Chắc chưa mà nhấn', 'Sai chắc rồi', 'Tỉ lệ đúng chắc 50%'])" onmouseleave="hideTalk()">Kiểm Tra</button>
        <button onclick="randomWord()" onmouseenter="showTalkAlternating('randomWord', ['Ra từ khó đó', 'Hehe', 'Nhấn mạnh dạn lên nhát vậy'])" onmouseleave="hideTalk()">Random Từ</button>
        <button onclick="openGuide()" onmouseenter="showTalkAlternating('randomGuide', ['Đọc cho kỹ kẻo sai', 'Hướng dẫn đọc làm gì vô làm luôn đi', 'Đọc xong cũng out'])" onmouseleave="hideTalk()">📘 Hướng dẫn</button>

        <button onclick="location.href='menu.html'" onmouseenter="showTalkAlternating('randomHome', ['Thoát về học lại đi', 'Làm sai nhiều thì thoát đi', 'Bye Bye'])" onmouseleave="hideTalk()">
            🏠 Trang chủ 
        </button>

        <p id="result"></p>
    </div>

    <div class="score">
        <p>✅ Đúng: <span id="correct">0</span></p>
        <p>❌ Sai: <span id="wrong">0</span></p>

        <div class="author">
            Coder by: Nguyễn Thành Tâm
        </div>
    </div>

</div>

<script src="sentences2.js"></script>
<script src="shiranui.js"></script>

<audio id="soundCorrect" src="concertD.mp3"></audio>
<audio id="soundWrong" src="concertS.mp3"></audio>

<script src="script.js"></script>

<!-- 🔥 ĐỒNG BỘ NỀN TOÀN HỆ THỐNG -->
<script>
window.addEventListener("load", () => {
    const saved = localStorage.getItem("bg-index");

    const backgrounds = [
        "bg-china.png",
        "bg-china2.png",
        "bg-china3.png",
        "bg-china4.png",
        "bg-china5.png"
    ];

    if(saved !== null){
        document.documentElement.style.setProperty(
            '--bg-image',
            `url("${backgrounds[saved]}")`
        );
    }
});
</script>
<audio id="bgMusic" loop></audio>
<script src="music.js"></script>

</body>
</html>
