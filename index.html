<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="login.css">
<title>Đăng nhập</title>
</head>

<body>

<div class="title">你好 - 请进说汉语</div>

<div class="box">
    <h2>Đăng nhập</h2>

    <input type="text" id="user" placeholder="Tên đăng nhập">
    <input type="password" id="pass" placeholder="Mật khẩu">

    <button onclick="login()">Vào trang</button>

    <p id="error"></p>
</div>

<script>
const USER = "admin";
const PASS = "1234";

function login(){
    const u = document.getElementById("user").value;
    const p = document.getElementById("pass").value;

    if(u === USER && p === PASS){
        localStorage.setItem("logged", "true");
        window.location.href = "menu.html";
    } else {
        document.getElementById("error").innerText = "Sai tài khoản hoặc mật khẩu!";
    }
}

window.onload = function(){
    if(localStorage.getItem("logged") === "true"){
        window.location.href = "menu.html";
    }
}
document.addEventListener("keydown", function(event){
    if(event.key === "Enter"){
        login();
    }
});
</script>
<div class="footer-credit">
    Coder by: Nguyễn Thành Tâm
</div>
</body>
</html>
