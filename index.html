<!DOCTYPE html>
<html lang="vi">
<head>
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Học Tiếng Trung</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json?v=2">

<!-- iOS ICON -->
<link rel="apple-touch-icon" sizes="180x180" href="logo.png">

<!-- iOS APP MODE -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Học Tiếng Trung">

<!-- ICON TRÌNH DUYỆT -->
<link rel="icon" type="image/png" href="logo.png?v=2">
<!-- CSS -->
<link rel="stylesheet" href="login.css?v=5">
<link rel="apple-touch-icon" href="logo.png">

</head>
</head>

<body>
<!-- VIDEO NỀN -->
<video 
class="bg-video"
autoplay
muted
loop
playsinline
webkit-playsinline
preload="auto">

    <source src="shiranui1.mp4?v=3" type="video/mp4">

</video>

<!-- MÀN HÌNH BAN ĐẦU -->
<div class="welcome" id="welcome">
    <div class="title">

        你好请进说汉语
    </div>



    <button class="start-btn" onclick="startLogin()">

        Bắt đầu

    </button>


</div>






<!-- LOGIN -->

<div class="box" id="loginBox">



    <div class="avatar">


        <video autoplay loop muted playsinline>

            <source src="nhanvat.mp4?v=3" type="video/mp4">

        </video>


    </div>



    <h2>Đăng nhập</h2>



    <input 
    type="text"
    id="user"
    placeholder="Tên đăng nhập">



    <input
    type="password"
    id="pass"
    placeholder="Mật khẩu">



    <button onclick="login()">

        Đăng nhập

    </button>



    <p id="error"></p>


</div>





<div class="footer-credit">

Coder by: Nguyễn Thành Tâm

</div>







<script>


function startLogin(){


    document.getElementById("welcome").style.display="none";


    document.getElementById("loginBox").style.display="block";


}






const USER="admin";

const PASS="1234";




function login(){


const u=document.getElementById("user").value;

const p=document.getElementById("pass").value;




if(u===USER && p===PASS){


sessionStorage.setItem("logged","true");


window.location.href="menu.html?v=3";


}

else{


document.getElementById("error").innerText=
"Sai tài khoản hoặc mật khẩu!";


}


}



</script>




</body>
</html>
