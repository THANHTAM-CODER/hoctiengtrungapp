<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>菜单</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta name="theme-color" content="#b22222">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="汉语">
<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial, sans-serif;

    background:url("bg-china2.png") no-repeat center center/cover;
}

.container{

    width:500px;
    max-width:90%;

    padding:30px;

    text-align:center;

    border-radius:25px;

    background:rgba(255,255,255,0.9);

    backdrop-filter:blur(10px);

    box-shadow:0 15px 40px rgba(0,0,0,0.3);
}

h1{
    color:#2563eb;
    margin-bottom:30px;
}

.menu-btn{

    width:100%;

    padding:18px;

    margin:10px 0;

    border:none;
    border-radius:15px;

    font-size:20px;
    font-weight:bold;

    color:white;

    cursor:pointer;

    transition:0.3s;
}

.menu-btn:hover{
    transform:scale(1.05);
}

.words{
    background:#16a34a;
}

.sentence{
    background:#dc2626;
}

.random{
    background:#2563eb;
}

</style>
</head>

<body>

<div class="container">

    <h1>📚 学汉语</h1>

    <button class="menu-btn words"
        onclick="location.href='words.html'">
        📚 Quản lý từ vựng
    </button>

    <button class="menu-btn sentence"
        onclick="location.href='page2.html'">
        📝 Ghép câu
    </button>

    <button class="menu-btn random"
        onclick="location.href='random.html'">
        🎲 Random Từ
    </button>

</div>

</body>
</html>
