<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>Tìm kiếm tiếng Trung</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;

    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background: url("bg-china2.png") no-repeat center center/cover;
    position: relative;
    overflow: hidden;
}

/* lớp tối + blur nền */


/* card chính */
.container {
    position: relative;
    z-index: 1;

    width: 700px;
    max-width: 95%;

    padding: 25px;

    border-radius: 25px;

    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    box-shadow: 0 20px 50px rgba(0,0,0,0.35);

    text-align: center;
    color: #333;
}

/* tiêu đề */
h2 {
    margin-bottom: 5px;
    font-size: 32px;
    color: #1d4ed8;
}

h3 {
    margin-top: 5px;
    font-size: 18px;
    color: #dc2626;
}

/* input */
input {
    width: 90%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    outline: none;

    margin-top: 15px;

    font-size: 15px;
}

/* button */
button {
    margin-top: 12px;
    padding: 10px 15px;

    border: none;
    border-radius: 12px;

    cursor: pointer;
    font-weight: bold;

    transition: 0.3s;
}

#searchBtn {
    background: #2563eb;
    color: white;
}

#toggleBtn {
    background: #dc2626;
    color: white;
}

button:hover {
    transform: scale(1.05);
}

/* bảng kết quả */
#result {
    margin-top: 20px;
    text-align: left;

    max-height: 450px;
    overflow-y: auto;
}

/* header bảng */
.header {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 80px;

    padding: 10px;

    background: #2563eb;

    border-radius: 10px;

    font-weight: bold;
    color: white;
}

/* item */
.item {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 80px;

    padding: 10px;
    margin-top: 8px;

    background: rgba(37,99,235,0.08);

    border-radius: 10px;

    transition: 0.3s;

    color: #333;
}

.item:hover {
    background: rgba(37,99,235,0.15);
    transform: translateX(5px);
}
#deleteBtn {
    background: #666;
    color: white;
}
#backBtn {
    background: #16a34a;
    color: white;
}

/* mode text */
#modeText {
    margin: 5px 0;
}

/* responsive */
@media(max-width:768px){
    .container {
        width: 95%;
        padding: 15px;
    }

    h2 {
        font-size: 26px;
    }

    h3 {
        font-size: 16px;
    }

    input {
        width: 95%;
    }
}
</style>
</head>

<body>
<div class="container">
<!-- tiêu đề -->
<h2>🔍 Tìm kiếm tiếng Trung</h2>
<h3 id="modeText">🔤 Đang tìm: Chữ Hán</h3>

<input type="text" id="searchInput" placeholder="Nhập từ cần tìm..." onkeydown="if(event.key==='Enter') searchWord()">

<br>
<!-- các button -->
<button id="searchBtn" onclick="searchWord()">Tìm kiếm</button>
<button id="toggleBtn" onclick="toggleMode()">Chuyển sang: Nghĩa</button>
<button id="deleteBtn" onclick="clearSearch()">🗑 Xóa</button>

<button id="backBtn" onclick="goHome()">🏠 Trang Chủ</button>
<button id="helpBtn" onclick="showHelp()"> 📖 Hướng dẫn</button>

<div id="result"></div>

</div>

<script src="sentences2.js"></script>

<script>

let searchMode = "hanzi";


function toggleMode() {
    let btn = document.getElementById("toggleBtn");
    let modeText = document.getElementById("modeText");

    if (searchMode === "hanzi") {
        searchMode = "meaning";
        btn.innerText = "Chuyển sang: Chữ Hán";
        modeText.innerText = "📖 Tìm kiếm theo: Nghĩa";
    } else {
        searchMode = "hanzi";
        btn.innerText = "Chuyển sang: Nghĩa";
        modeText.innerText = "🔤 Tìm kiếm theo: Chữ Hán";
    }
}

/* hàm tìm kiếm */
/* hàm tìm kiếm */
function searchWord() {

    let input = document.getElementById("searchInput").value.trim();
    let resultDiv = document.getElementById("result");

    resultDiv.innerHTML = "";

    if (!input) {
        resultDiv.innerHTML = "⚠️ Vui lòng nhập từ cần tìm !";
        return;
    }

    let found = sentences2.filter(item => {
        if (searchMode === "hanzi") {
            return item.hanzi === input;
        } else {
            return item.meaning === input;
        }
    });

    if (found.length === 0) {
        resultDiv.innerHTML = "❌ Không tìm thấy từ cần tìm !";
        return;
    }

    resultDiv.innerHTML += `
        <div class="header">
            <div>Hán tự</div>
            <div>Nghĩa</div>
            <div>Pinyin</div>
            <div>Phát âm </div>
        </div>
    `;

    found.forEach(item => {
    resultDiv.innerHTML += `
        <div class="item">
            <div>${item.hanzi}</div>
            <div>${item.meaning}</div>
            <div>${item.pinyin}</div>

            <div>
                <button class="speak-btn"
                    onclick="speakChinese('${item.hanzi}')">
                    🔊
                </button>
            </div>
        </div>
    `;
     }); 
}

/* đọc tiếng Trung */
function speakChinese(text) {

    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);

    utterance.lang = "zh-CN";
    utterance.rate = 0.9;
    utterance.pitch = 1;

    speechSynthesis.speak(utterance);
}
/* hàm xóa và input kết quả*/
function clearSearch() {
    document.getElementById("searchInput").value = "";
    document.getElementById("result").innerHTML = "";
}
/* hàm quay về trang chủ*/
function goHome() {
    window.location.href = "index.html";
}
/* hàm hiển thị hướng dẫn */
function showHelp() {
    alert("Hướng dẫn sử dụng:\n1. Nhập từ cần tìm vào ô nhập liệu.\n2. Nhấn Enter hoặc click vào nút 'Tìm kiếm' để thực hiện tìm kiếm.\n3. Sử dụng nút 'Chuyển sang: Nghĩa' để chuyển đổi giữa tìm kiếm theo chữ Hán và nghĩa.\n4. Nhấn 'Xóa' để xóa nội dung tìm kiếm và kết quả.");
}

</script>

</body>
</html>
