<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>Tìm kiếm tiếng Trung</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;

    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background: url("bg-china2.png") no-repeat center center/cover;
    position: relative;
    overflow: hidden;
}

/* lớp tối + blur nền */


/* card chính */
.container {
    position: relative;
    z-index: 1;

    width: 450px;
    padding: 25px;

    border-radius: 20px;

    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    border: 1px solid rgba(255,255,255,0.2);

    box-shadow: 0 10px 40px rgba(0,0,0,0.4);

    text-align: center;
    color: white;
}

/* tiêu đề */
h2 {
    margin-bottom: 5px;
    font-size: 26px;
}

h3 {
    margin-top: 5px;
    font-size: 16px;
    color: #ffd700;
}

/* input */
input {
    width: 90%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    outline: none;

    margin-top: 15px;

    font-size: 15px;
}

/* button */
button {
    margin-top: 12px;
    padding: 10px 15px;

    border: none;
    border-radius: 12px;

    cursor: pointer;
    font-weight: bold;

    transition: 0.3s;
}

#searchBtn {
    background: #00c6ff;
    color: white;
}

#toggleBtn {
    background: #ff6b6b;
    color: white;
}

button:hover {
    transform: scale(1.05);
}

/* bảng kết quả */
#result {
    margin-top: 20px;
    text-align: left;
}

/* header bảng */
.header {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;

    padding: 10px;
    background: rgba(255,255,255,0.25);

    border-radius: 10px;

    font-weight: bold;
}

/* item */
.item {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;

    padding: 10px;
    margin-top: 8px;

    background: rgba(255,255,255,0.15);
    border-radius: 10px;

    transition: 0.3s;
}

.item:hover {
    background: rgba(255,255,255,0.3);
    transform: translateX(5px);
}

/* mode text */
#modeText {
    margin: 5px 0;
}

/* responsive */
@media(max-width:500px){
    .container {
        width: 90%;
    }
}
</style>
</head>

<body>

<div class="container">

<h2>🔍 Tìm kiếm tiếng Trung</h2>
<h3 id="modeText">🔤 Đang tìm: Chữ Hán</h3>

<input type="text" id="searchInput" placeholder="Nhập từ cần tìm...">

<br>

<button id="searchBtn" onclick="searchWord()">Tìm kiếm</button>
<button id="toggleBtn" onclick="toggleMode()">Chuyển sang: Nghĩa</button>

<div id="result"></div>

</div>

<script src="sentences2.js"></script>

<script>
let searchMode = "hanzi";

function toggleMode() {
    let btn = document.getElementById("toggleBtn");
    let modeText = document.getElementById("modeText");

    if (searchMode === "hanzi") {
        searchMode = "meaning";
        btn.innerText = "Chuyển sang: Chữ Hán";
        modeText.innerText = "📖 Đang tìm: Nghĩa";
    } else {
        searchMode = "hanzi";
        btn.innerText = "Chuyển sang: Nghĩa";
        modeText.innerText = "🔤 Đang tìm: Chữ Hán";
    }
}

function searchWord() {
    let input = document.getElementById("searchInput").value.trim();
    let resultDiv = document.getElementById("result");

    resultDiv.innerHTML = "";

    if (!input) {
        resultDiv.innerHTML = "⚠️ Vui lòng nhập từ!";
        return;
    }

    let found = sentences2.filter(item => {
        if (searchMode === "hanzi") {
            return item.hanzi === input;
        } else {
            return item.meaning === input;
        }
    });

    if (found.length === 0) {
        resultDiv.innerHTML = "❌ Không tìm thấy!";
        return;
    }

    resultDiv.innerHTML += `
        <div class="header">
            <div>Hán tự</div>
            <div>Nghĩa</div>
            <div>Pinyin</div>
        </div>
    `;

    found.forEach(item => {
        resultDiv.innerHTML += `
            <div class="item">
                <div>${item.hanzi}</div>
                <div>${item.meaning}</div>
                <div>${item.pinyin}</div>
            </div>
        `;
    });
}
</script>

</body>
</html>
