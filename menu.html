<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<title>菜单</title>

<style>
:root{
    --bg-image: url("bg-china2.png");
}

body{
    margin:0;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial, sans-serif;

    position:relative;
    overflow:hidden;
}

/* NỀN CHUNG */
body::before{
    content:"";
    position:fixed;
    inset:0;

    background-image: var(--bg-image);
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    z-index:-2;
}

/* LỚP CARD */
.container{
    width:500px;
    max-width:90%;

    padding:30px;
    text-align:center;

    border-radius:25px;

    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(10px);

    box-shadow:0 15px 40px rgba(0,0,0,0.3);
}

h1{
    color:#2563eb;
    margin-bottom:30px;
}

.menu-btn{
    width:100%;
    padding:18px;
    margin:10px 0;

    border:none;
    border-radius:15px;

    font-size:20px;
    font-weight:bold;

    color:white;
    cursor:pointer;

    transition:0.3s;
}

.menu-btn:hover{
    transform:scale(1.05);
}

.words{ background:#16a34a; }
.sentence{ background:#dc2626; }
.random{ background:#2563eb; }

/* NÚT ĐỔI NỀN */
.bg-btn{
    position:fixed;
    top:15px;
    right:15px;

    width:45px;
    height:45px;

    border:none;
    border-radius:50%;

    font-size:20px;

    cursor:pointer;

    background:rgba(255,255,255,0.8);
    backdrop-filter:blur(10px);

    box-shadow:0 5px 15px rgba(0,0,0,0.2);

    transition:0.3s;
}

.bg-btn:hover{
    transform:scale(1.1);
}
</style>
</head>

<body>

<!-- NÚT ĐỔI NỀN -->
<button class="bg-btn" onclick="setBg()">
    <img src="logo1.png" class="bg-icon">
</button>

<div class="container">

    <h1>📚 学汉语</h1>

    <button class="menu-btn words"
        onclick="location.href='words.html'">
        📚 Quản lý từ vựng
    </button>

    <button class="menu-btn sentence"
        onclick="location.href='page2.html'">
        📝 Ghép câu
    </button>

    <button class="menu-btn random"
        onclick="location.href='ramdom.html'">
        🎲 Random Từ
    </button>

    <button class="menu-btn words"
        onclick="location.href='write.html'">
        ✍️ Luyện viết
    </button>
    <button onclick="logout()">Đăng xuất</button>

<script>
function logout(){
    localStorage.removeItem("logged");
    window.location.href = "index.html";
}
</script>

</div>

<script>
const backgrounds = [
    "bg-china.png",
    "bg-china2.png",
    "bg-china3.png",
    "bg-china4.png",
    "bg-china5.png"
];

let index = 0;

// đổi nền (toàn bộ web)
function setBg(){
    index = (index + 1) % backgrounds.length;

    document.documentElement.style.setProperty(
        '--bg-image',
        `url("${backgrounds[index]}")`
    );

    localStorage.setItem("bg-index", index);
}

// load nền khi mở trang
window.addEventListener("load", () => {
    const saved = localStorage.getItem("bg-index");

    if(saved !== null){
        index = parseInt(saved);
        document.documentElement.style.setProperty(
            '--bg-image',
            `url("${backgrounds[index]}")`
        );
    }
});
</script>
</body>
</html>
