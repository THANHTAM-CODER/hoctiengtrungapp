<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<title>菜单</title>

<style>
:root{
    --bg-image: url("bg-china2.png");
}

body{
    margin:0;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial, sans-serif;

    position:relative;
    overflow:hidden;
}

/* NỀN CHUNG */
body::before{
    content:"";
    position:fixed;
    inset:0;

    background-image: var(--bg-image);
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    z-index:-2;
}

/* LỚP CARD */
.container{
    width:500px;
    max-width:90%;

    padding:30px;
    text-align:center;

    border-radius:25px;

    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(10px);

    box-shadow:0 15px 40px rgba(0,0,0,0.3);
}

h1{
    color:#2563eb;
    margin-bottom:30px;
}

.menu-btn{
    width:100%;
    padding:18px;
    margin:10px 0;

    border:none;
    border-radius:15px;

    font-size:20px;
    font-weight:bold;

    color:white;
    cursor:pointer;

    transition:0.3s;
}

.menu-btn:hover{
    transform:scale(1.05);
}

.words{ background:#16a34a; }
.sentence{ background:#dc2626; }
.random{ background:#2563eb; }
.write{ background:#f59e0b; }
.test{ background:#8b5cf6; }

/* NÚT ĐỔI NỀN */
.bg-btn{
    position:fixed;
    top:15px;
    right:15px;

    width:45px;
    height:45px;

    border:none;
    border-radius:50%;

    font-size:20px;

    cursor:pointer;

    background:rgba(255,255,255,0.8);
    backdrop-filter:blur(10px);

    box-shadow:0 5px 15px rgba(0,0,0,0.2);

    transition:0.3s;
}

.bg-btn:hover{
    transform:scale(1.1);
}
#hintArrow{
    position:fixed;
    top:20px;
    right:80px;

    background:none;
    color:#fff;

    font-size:22px;
    font-weight:bold;

    display:none;
    z-index:9999;

    text-shadow:
        2px 2px 5px rgba(0,0,0,0.8);

    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.08);}
    100%{transform:scale(1);}
}
.bottom-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:10px;
}

.logout-btn,
.setting-btn{
    width:160px;
    height:55px;

    border:none;
    border-radius:10px;

    color:white;
    font-size:18px;
    font-weight:bold;

    cursor:pointer;
}

.logout-btn{
    background:#2563eb;
}

.setting-btn{
    background:#2563eb;
}

.settings-box{
    
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:280px;
    background:white;
    border-radius:15px;
    padding:20px;

    box-shadow:0 8px 30px rgba(0,0,0,0.3);
    z-index:9999;
}

.settings-box label{
    display:block;
    margin:10px 0;
    font-size:16px;
}
.setting-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    font-size:20px;
}

/* chữ bên trái */
.setting-row span{
    white-space:nowrap;
}

/* slider bên phải */
.setting-row input[type="range"]{
    flex:1;
    max-width:100px;
}
.logout-btn,
.setting-btn{
    border:none;
    color:white;
    font-size:18px;
    font-weight:bold;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;

    width:130px;
}
input[type="range"]{
    width: 100%;
    height: 6px;
    border-radius: 10px;
    outline: none;
    cursor: pointer;

    /* nền track */
    background: #ddd;

    transition: 0.2s;
}
input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #2563eb;
    cursor: pointer;

    transition: 0.2s;
}

input[type="range"]::-webkit-slider-thumb:hover{
    transform: scale(1.2);
}
.setting-row input[type="checkbox"]{
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: #2563eb;
}
#musicList{
    flex:1;
    max-width:150px;
    padding:6px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:15px;
}
.setting-btn{
    background:#2563eb;
    transition:0.25s;
}

/* khi hover */
.setting-btn:hover{
    box-shadow:0 0 12px rgba(37,99,235,0.5);
}

/* khi nhấn */
.setting-btn:active{
    transform:scale(0.97);
}

/* khi đang mở */
.setting-btn.active{
    animation:musicGlow 1.2s infinite alternate;
}

@keyframes musicGlow{
    from{
        box-shadow:
            0 0 15px #3b82f6,
            0 0 30px #3b82f6;
    }
    to{
        box-shadow:
            0 0 35px #3b82f6,
            0 0 70px #3b82f6,
            0 0 100px #3b82f6;
    }
}
</style>
</head>

<body>

<!-- NÚT ĐỔI NỀN -->
<button class="bg-btn" onclick="setBg()">
    <img src="logo1.png" class="bg-icon">
</button>
<div id="hintArrow">
👉Nhấn đi
</div>
<div class="assistant">

    <div class="talk" id="talk">
        Xin chào 😄
    </div>

    <div class="avatar-circle">
        <video autoplay loop muted playsinline>
            <source src="nhanvat.mp4" type="video/mp4">
        </video>
    </div>

</div>
<div class="container">

    <h1>📚 学汉语</h1>

    <button class="menu-btn words"
        onmouseenter="showTalk('Ồ học từ mới à? Đừng học xong rồi quên nha 😂')"
        onmouseleave="hideTalk()"
        onclick="location.href='words.html'">
    📚 Quản lý từ vựng

    </button>

    <button class="menu-btn sentence"
        onmouseenter="showTalk('Ghép câu cẩn thận nha, đừng đảo chữ lung tung 😏')"
        onmouseleave="hideTalk()"
        onclick="location.href='page2.html'">
        📝 Ghép câu
    </button>

    <button class="menu-btn random"
        onmouseenter="showTalk('Random từ hả? Hên xui đó nha 🤭')"
        onmouseleave="hideTalk()"
        onclick="location.href='ramdom.html'">
        🎲 Random Từ
    </button>

    <button class="menu-btn write"
        onmouseenter="showTalk('Luyện viết à? Viết cho đẹp nha, chữ xấu tôi chê đó 😆')"
        onmouseleave="hideTalk()"
        onclick="location.href='write.html'">
        ✍️ Luyện viết
    </button>

    <button class="menu-btn test"
        onmouseenter="showTalk('Vào kiểm tra hả? Chuẩn bị bị soi điểm nha 😂')"
        onmouseleave="hideTalk()"
        onclick="location.href='test.html'">
        ✍️ Đề thi trắc nghiệm
    </button>
    <div class="bottom-buttons">

    <button class="logout-btn" 
    onmouseenter="showTalk('Thoát rồi à gà vl 😂')"
    onmouseleave="hideTalk()"
    onclick="logout()">
        Đăng xuất
    </button>

    <button class="setting-btn" 
    onmouseenter="showTalk('Thêm tí nhạc cho thoải mái 😂')"
    onmouseleave="hideTalk()"
    onclick="toggleSettings()">
        Nhạc
    </button>
    <button class="shiranui-btn" onclick="toggleShiranuiBox()">
    Shiranui
    </button>
    </div>
    <div id="settingsBox" class="settings-box">

    <div class="setting-row">
    <span>🎵 Bật nhạc</span>
     <input type="checkbox" id="musicToggle">
    </div>
    <div class="setting-row">
    <span>🔊 Âm lượng</span>
    <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="1">
    </div>
    <div class="setting-row">
    <span>🎶 Chọn nhạc</span>
    <select id="musicList">
        <option value="musicall/music1.mp3">Bài 1</option>
        <option value="musicall/music2.mp3">Bài 2</option>
        <option value="musicall/music3.mp3">Bài 3</option>
        <option value="musicall/music4.mp3">Bài 4</option>
        <option value="musicall/music5.mp3">Bài 5</option>
    </select>
</div>
</div>
<div id="shiranuiBox" class="settings-box">


<div class="setting-row">

<span>👧 Hiện nhân vật</span>

<input 
type="checkbox"
id="shiranuiToggle">

</div>


</div>
<script>
function logout(){
    localStorage.removeItem("logged");
    window.location.href = "index.html";
}
</script>

</div>

<script>
const backgrounds = [
    "bg-china.png",
    "bg-china2.png",
    "bg-china3.png",
    "bg-china4.png",
    "bg-china5.png"
];

let index = 0;

// đổi nền (toàn bộ web)
function setBg(){
    index = (index + 1) % backgrounds.length;

    document.documentElement.style.setProperty(
        '--bg-image',
        `url("${backgrounds[index]}")`
    );

    localStorage.setItem("bg-index", index);
}

// load nền khi mở trang
window.addEventListener("load", () => {
    const saved = localStorage.getItem("bg-index");

    if(saved !== null){
        index = parseInt(saved);
        document.documentElement.style.setProperty(
            '--bg-image',
            `url("${backgrounds[index]}")`
        );
    }
});
</script>
<script>
function showHint(){

    const hint = document.getElementById("hintArrow");

    hint.style.display = "block";

    setTimeout(() => {
        hint.style.display = "none";
    }, 3000);
}

// hiện lần đầu sau 5 phút
setTimeout(showHint, 60000);

// lặp lại mỗi 5 phút
setInterval(showHint, 300000);
function toggleSettings(){

    const box = document.getElementById("settingsBox");
    const btn = document.querySelector(".setting-btn");

    if(box.style.display === "block"){

        box.style.display = "none";
        btn.classList.remove("active");

    }else{

        box.style.display = "block";
        btn.classList.add("active");

    }
}
window.addEventListener("load", function () {

    const music = document.getElementById("music");
    if (music) {
        music.checked = false;
    }

    const audio = document.getElementById("audio");
    if (audio) {
        audio.pause();
        audio.currentTime = 0;
    }
});

document.addEventListener("keydown", function(event){
    if(event.key === "Enter"){
        login();
    }
});


function showTalk(text){

    let talk=document.getElementById("talk");

    talk.innerHTML=text;

    talk.classList.add("show");

}


function hideTalk(){

    let talk=document.getElementById("talk");

    talk.classList.remove("show");

}
function toggleShiranuiBox(){

    const box =
    document.getElementById("shiranuiBox");

    const btn =
    document.querySelector(".shiranui-btn");


    if(box.style.display==="block"){

        box.style.display="none";

        btn.classList.remove("active");

    }
    else{

        box.style.display="block";

        btn.classList.add("active");

    }

}
document.addEventListener("DOMContentLoaded", () => {
const shiranuiToggle = document.getElementById("shiranuiToggle");
const shiranui = document.querySelector(".assistant");
const talk = document.getElementById("talk");
const storageKey = "shiranui-visible";

const onMessages = [
    "Cảm ơn đã cho tôi ra khỏi đây 😭",
    "Cuối cùng cũng được thở rồi 😆",
    "Tự do rồi!! 🤩"
];

const offMessages = [
    "Dám nhốt tôi sao 😠",
    "Tôi sẽ quay lại đó!",
    "Không thoát tôi được đâu 😤"
];

if (shiranuiToggle && shiranui) {

    const savedState = localStorage.getItem(storageKey) === "true";
    shiranuiToggle.checked = savedState;
    shiranui.style.display = savedState ? "flex" : "none";

    shiranuiToggle.addEventListener("change", () => {

        localStorage.setItem(storageKey, shiranuiToggle.checked ? "true" : "false");

        if (shiranuiToggle.checked) {

            shiranui.style.display = "flex";

            const msg = onMessages[Math.floor(Math.random() * onMessages.length)];

            talk.innerHTML = msg;
            talk.classList.add("show");

        } else {

            const msg = offMessages[Math.floor(Math.random() * offMessages.length)];

            talk.innerHTML = msg;
            talk.classList.add("show");

            setTimeout(() => {
                shiranui.style.display = "none";
                talk.classList.remove("show");
            }, 1200);
        }

    });
}
});
</script>
</script>
<audio id="bgMusic" loop></audio>
<script src="music.js"></script>
</body>
</html>
